    <!-- FAQ Schema.org -->
    <script type="application/ld+json">
    {

        {
          "@type": "Question",
          "name": "¿Cómo inicio un juicio por alimentos en Buenos Aires?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Para iniciar un juicio por alimentos, debe presentar una demanda ante el Juzgado de Familia correspondiente. Debe acreditar el vínculo familiar, la necesidad del alimentante y las posibilidades económicas del alimentado. Asesoramiento legal es fundamental para agilizar el proceso."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué es el cuidado personal unilateral y cuándo se otorga?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El cuidado personal unilateral implica que uno solo de los progenitores tiene la responsabilidad cotidiana del hijo. Se otorga cuando es lo más conveniente para el niño, considerando su interés superior, edad, opinión y relación con cada progenitor."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo solicitar una orden de protección por violencia familiar?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Puede solicitarse en cualquier momento, de urgencia si es necesario, ante el Juzgado de Familia o la Oficina de Violencia Doméstica (OVD). La orden puede incluir exclusión del hogar, prohibición de acercamiento y otras medidas de protección inmediata."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuál es la diferencia entre patria potestad y cuidado personal?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La patria potestad se refiere a los deberes y derechos de los padres respecto de sus hijos menores (representación legal, administración de bienes). El cuidado personal es la convivencia cotidiana con el hijo. Pueden estar separados: ambos padres mantienen la patria potestad mientras uno tiene el cuidado personal."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué requisitos se necesitan para adopción en Argentina?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Los adoptantes deben estar inscriptos en el Registro de Adoptantes, tener al menos 25 años, diferencia de edad mínima de 16 años con el adoptado, y acreditar idoneidad física, psíquica, moral y económica. El proceso incluye evaluaciones técnicas multidisciplinarias."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué hacer si mi hijo está en un hogar de niños?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Si su hijo fue separado de su cuidado y se encuentra en un hogar, tiene derecho a ser informado, mantener comunicación y trabajar en un plan de fortalecimiento familiar para la revinculación. Es fundamental contar con asesoramiento legal especializado en protección de derechos del niño."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cómo se tramita una sucesión en Buenos Aires?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La sucesión se inicia ante el Juzgado Civil correspondiente al último domicilio del causante. Debe presentarse partida de defunción, certificado de bienes, declaración de herederos o testamento. El proceso incluye inventario, avalúo y partición de bienes entre los herederos."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué protección legal existe contra la violencia doméstica?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La Ley 26.485 de Protección Integral contra la Violencia contra las Mujeres y la Ley 114 (CABA) ofrecen múltiples recursos: órdenes de protección, exclusión del hogar, prohibición de contacto, asistencia psicológica y legal gratuita. La denuncia puede realizarse en comisarías, OVD o Juzgados de Familia."
          }
        }
      ]
    }
